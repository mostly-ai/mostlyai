name: '[CPU] mostlyai Tests'

on: [workflow_call]

env:
  PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
  FORCE_COLOR: '1'

jobs:
  run-test-cpu-local:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          submodules: 'true'

      - name: Setup | uv
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5
        with:
          enable-cache: false
          python-version: '3.11'

      - name: Setup | Dependencies
        run: |
          uv sync --frozen --only-group dev
          uv pip install --index-strategy unsafe-first-match torch==2.9.1+cpu torchvision==0.24.1+cpu ".[local]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Test | End-to-End (Local mode only)
        run: |
          uv run --no-sync pytest -vv tests/_local/end_to_end -k 'not (client and mode)'

      - name: Test | Unit Tests
        run: |
          uv run --no-sync pytest -vv tests/client/unit
          uv run --no-sync pytest -vv tests/_data/unit
          uv run --no-sync pytest -vv tests/_local/unit
          uv run --no-sync pytest -vv tests/test_domain.py
