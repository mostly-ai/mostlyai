name: '[CPU] mostlyai Tests'

on: [workflow_call]

env:
  PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
  FORCE_COLOR: '1'

jobs:
  run-test-cpu-local:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: 'true'

      - name: Setup | uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
          python-version: '3.11'

      - name: Setup | Dependencies
        run: |
          uv sync --frozen --only-group dev
          uv pip install --index-strategy unsafe-first-match torch==2.13.0+cpu torchvision==0.28.0+cpu torchaudio==2.11.0+cpu ".[local]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint | Type Check (ty, non-blocking)
        run: |
          uv run --no-sync ty check --exit-zero --output-format concise

      - name: Test | End-to-End (Local mode only)
        run: |
          uv run --no-sync pytest -vv tests/_local/end_to_end -k 'not (client and mode)'

      - name: Test | Unit Tests
        run: |
          uv run --no-sync pytest -vv tests/client/unit
          uv run --no-sync pytest -vv tests/_data/unit
          uv run --no-sync pytest -vv tests/_local/unit
          uv run --no-sync pytest -vv tests/test_domain.py
