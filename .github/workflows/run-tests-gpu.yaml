name: '[GPU] mostlyai Tests'

on: [workflow_call]

env:
  PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
  FORCE_COLOR: '1'

jobs:
  run-test-gpu:
    runs-on: gha-gpu-public-internal
    container:
      image: nvidia/cuda:13.0.2-cudnn-runtime-ubuntu24.04
      options: --gpus all
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup | Install Git
        run: |
          export DEBIAN_FRONTEND=noninteractive
          ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
          echo "Etc/UTC" > /etc/timezone
          apt-get update -qq
          apt-get install -y --no-install-recommends git tzdata build-essential

      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: 'true'

      - name: Setup | uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
          python-version: '3.11'

      - name: Setup | Dependencies
        run: |
          uv sync --frozen --only-group dev
          uv pip install ".[local-gpu]"

      - name: Setup | Check for available GPU-s
        run: nvidia-smi

      - name: Test | End-to-End Tests
        # client mode e2e test will be skipped when no extra environment variable is provided
        run: |
          uv run --no-sync pytest -vv tests/_local/end_to_end
