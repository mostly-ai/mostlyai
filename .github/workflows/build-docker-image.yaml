name: Build mostlyai Docker Image

on:
  workflow_dispatch:
  workflow_call:

env:
  PLATFORMS: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 1}

      - name: Setup | Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          cleanup: false
          platforms: ${{ env.PLATFORMS }}

      - name: Setup | Docker Build Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v.6.2.0
        id: meta
        with:
          images: ghcr.io/mostly-ai/sdk

      - name: Setup | Docker Login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build | Build Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc #v7.4.0
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_CHECKS_ANNOTATIONS: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          platforms: ${{ env.PLATFORMS }}
          outputs: type=registry,compression=zstd,force-compression=true,oci-mediatypes=true,compression-level=9
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
